# Deploy a private development network with one witness and one fullnode
# Usage: SR_PRIVATE_KEY=<key> trond network create --intent examples/private-network.yaml
name: private-dev

target:
  type: local
  runtime: docker

network: private

nodes:
  - type: witness
    version: latest
    witness_key:
      private_key_env: SR_PRIVATE_KEY
    features:
      metrics: true
    resources:
      memory: 8GB
    ports:
      http: 8090
      grpc: 50051
      p2p: 18888
      metrics: 9527

  - type: fullnode
    version: latest
    features:
      jsonrpc: true
      metrics: true
    resources:
      memory: 8GB
    ports:
      # Host http must dodge the witness's 8090 — but NOT 8091/8092: those are
      # java-tron's in-container solidityPort/PBFTPort defaults, and the 1:1
      # port mapping would collide with them (trond rejects such intents).
      http: 8095
      grpc: 50052
      jsonrpc: 8545
      p2p: 18889
      # Distinct metrics port — both nodes default to 9527 if
      # unset, which collides at docker port-bind time.
      metrics: 9528
